    <title>Notice.</title>
    <meta name="description" content="Avisos, eventos e comunicados da ETEC de Campo Limpo Paulista em um só lugar." />
    <script>
      // aplica o tema salvo antes de a página aparecer (evita piscar)
      try {
        var t = localStorage.getItem("notice-tema");
        if (t !== "claro" && t !== "escuro") t = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
