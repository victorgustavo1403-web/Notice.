<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>Sem conexão — Notice.</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #333; background: linear-gradient(135deg, #b9aeae 0%, #f5f3ee 25%, #fff 50%, #f5f4ee 80%, #b9aeae 100%); }
  main { max-width: 360px; padding: 32px 24px; border-radius: 32px; background: rgba(255,255,255,.8); box-shadow: 0 18px 40px rgba(0,0,0,.12); }
  h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -.03em; }
  p { margin: 0 0 22px; line-height: 1.5; color: #666; }
  button { padding: 13px 28px; border: 0; border-radius: 60px; background: #333; color: #f5f4ee; font: 800 1rem inherit; font-family: inherit; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    body { color: #f5f4ee; background: #141412; }
    main { background: #222220; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
    p { color: #aaa; } button { background: #f5f4ee; color: #222; }
  }
</style>
</head>
<body>
<main>
  <h1>Você está sem conexão.</h1>
  <p>O Notice. precisa de internet para mostrar os avisos mais recentes. Confira sua rede e tente de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
